steps:
  # Step 1: Verify App Engine Infrastructure (Debug)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Checking App Engine Application Status..."
        echo "Build configured for Client ID: ${_VITE_GOOGLE_CLIENT_ID}"
        gcloud app describe || echo "WARNING: App Engine application might be missing!"
        gcloud app services list || echo "WARNING: Could not list services!"

  # Step 2: Deploy the Backend Service (FastAPI) - Deployed as default service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd backend
        gcloud app deploy app.yaml --quiet

timeout: '1600s'
substitutions:
  _VITE_GOOGLE_CLIENT_ID: '292043291680-ud9pk0cnv2fp0jtt5joaj68dn1oad2h1.apps.googleusercontent.com'
options:
  logging: CLOUD_LOGGING_ONLY